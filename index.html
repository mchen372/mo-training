<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0a"><link rel="manifest" href="manifest.webmanifest"><title>MO TRAINING</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0a;color:#f4f6f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:760px;margin:auto;padding:22px 18px 150px}.muted{color:#8b938e}.green{color:#a7ff3f}.hero{padding:14px 2px 16px}.hero h1{font-size:38px;line-height:1;margin:9px 0 10px}.card{background:#141715;border:1px solid #252a27;border-radius:20px;padding:16px;margin:10px 0}.week{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x proximity;scrollbar-width:none}.week::-webkit-scrollbar{display:none}.day{min-width:68px;scroll-snap-align:start;padding:12px 8px;border-radius:14px;background:#171a18;border:1px solid #292e2b;text-align:center;color:#aeb5b0}.day.on{background:#a7ff3f;color:#071006;border-color:#a7ff3f}.section-title{display:flex;justify-content:space-between;align-items:end;margin:14px 0 10px}.section-title h2{margin:0}.overview{padding:0}.overview-item{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:14px 0;border-bottom:1px solid #252a27;align-items:center}.num{color:#5f6862;text-align:left;font-variant-numeric:tabular-nums}.overview-item b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.overview-item small{white-space:nowrap;text-align:right;margin-left:8px}.facts{display:flex;gap:10px;margin:10px 0 12px}.fact{flex:1;background:#111411;border:1px solid #222724;border-radius:14px;padding:12px}.fact b{display:block;font-size:20px}.fact small{color:#788079}.progress{height:5px;background:#222724;border-radius:9px;overflow:hidden;margin:12px 0 4px}.progress i{display:block;height:100%;background:#a7ff3f;width:0}.summary{display:flex;justify-content:space-between;font-size:13px;color:#89918c}.exercise.done{border-color:#47642d}.exhead{display:flex;justify-content:space-between;gap:10px}.check{width:30px;height:30px;border-radius:50%;border:1px solid #3a413c;background:#1b1f1c;color:#667068}.check.on,.setdone.on{background:#26351b;color:#a7ff3f;border-color:#47642d}.exercise h3{margin:0 0 5px;font-size:17px}.meta{font-size:13px;color:#9da49f}.warn{border-left:3px solid #f5c542;padding-left:10px;color:#d9d2ad;margin-top:10px;font-size:13px}.sets{margin-top:10px;display:grid;grid-template-columns:28px 1fr 1fr 1fr 38px;gap:6px;align-items:center}.sets input{min-width:0;width:100%;background:#0d100e;border:1px solid #303632;border-radius:10px;color:white;padding:10px 4px;text-align:center;font-size:16px}.sets input:focus{outline:1px solid #a7ff3f}.setdone{height:36px;border-radius:10px;border:1px solid #303632;background:#111411;color:#777}.sets span{text-align:center;color:#777}.note{text-align:center;padding:32px 16px}.bottom{position:fixed;bottom:72px;left:0;right:0;padding:10px 18px;background:linear-gradient(transparent,#090b0a 25%)}.primary{display:block;margin:auto;width:min(728px,100%);background:#a7ff3f;color:#081007;border:0;border-radius:17px;padding:15px;font-weight:800;font-size:16px}.primary.running{background:#f4f6f5}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;height:calc(72px + env(safe-area-inset-bottom));padding:8px 18px env(safe-area-inset-bottom);background:#0f1110;border-top:1px solid #242925;display:flex;justify-content:center}.tabs-inner{width:min(728px,100%);display:grid;grid-template-columns:repeat(3,1fr)}.tab{border:0;background:transparent;color:#707872;border-radius:12px;font-size:11px;font-weight:600}.tab b{display:block;font-size:20px;line-height:24px}.tab.on{color:#a7ff3f}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.cal-label{text-align:center;color:#626a65;font-size:11px;padding:5px}.cal-day{aspect-ratio:1;border-radius:12px;background:#121513;border:1px solid #222724;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;gap:3px}.cal-day.today{border-color:#a7ff3f}.cal-day.done{background:#26351b;color:#a7ff3f}.dot{width:4px;height:4px;border-radius:50%;background:#a7ff3f}.plan-list{padding-left:14px;padding-right:14px}.history-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #252a27}.history-row strong{display:block;margin-bottom:4px}.hidden{display:none!important}button{cursor:pointer}small{color:#788079}</style></head><body><main>
<div class="hero"><div class="muted" id="date"></div><h1>MO <span class="green">TRAINING</span></h1><div class="muted" id="heroSub">先看今天练什么，再开始。</div></div>
<div class="week" id="week"></div><div class="section-title"><h2 id="title"></h2><small id="modeLabel">今日计划</small></div><div id="overview"></div><div id="workout" class="hidden"><div class="progress"><i id="bar"></i></div><div class="summary"><span id="count"></span><span id="volume"></span></div><div id="list"></div></div>
</main><div class="bottom" id="ctaBar"><button class="primary" id="action">开始今天的训练</button></div><nav class="tabs"><div class="tabs-inner"><button class="tab on" data-tab="today"><b>●</b>今日</button><button class="tab" data-tab="calendar"><b>▦</b>日历</button><button class="tab" data-tab="history"><b>◴</b>记录</button></div></nav><script>
const P={1:["上胸 · 侧三角 · 三头",[["上斜杠铃卧推",3,"6–8","1–2"],["平板杠铃卧推",3,"6–8","1–2"],["蝴蝶机 / 绳索夹胸",2,"10–15","1"],["绳索侧平举",4,"12–20","1"],["绳索过顶臂屈伸",3,"10–15","1"],["绳索下压",2,"10–15","1"]]],2:["背宽 · 二头",[["辅助引体 / 中立位下拉",3,"6–10","1–2"],["单臂高位下拉",3,"8–12","1"],["胸托划船",3,"8–12","1–2"],["直臂下压",2,"12–15","1"],["上斜哑铃弯举",3,"8–12","1"],["锤式弯举",3,"10–15","1"]]],3:["恢复日 · 游泳",[],"轻—中等强度游泳 45–60 分钟。今天不竞速。"],4:["肩 · 背 · 手臂",[["坐姿哑铃推肩",3,"6–10","1–2","核心收紧，避免腰椎过伸；先用 20kg/手稳定完成。"],["绳索侧平举",4,"12–20","1"],["反向蝴蝶机",3,"12–20","1"],["高位下拉",3,"8–12","1–2"],["绳索过顶臂屈伸",3,"10–15","1"],["牧师凳弯举",3,"8–12","1"]]],5:["完全休息",[],"今天不补训练。恢复本身就是计划的一部分。"],6:["上胸 · 侧三角 + 游泳",[["上斜器械 / 哑铃推胸",3,"8–12","1–2"],["低位向上绳索夹胸",2,"12–15","1"],["器械侧平举",4,"12–20","1"]],"力量后中等强度游泳 45–60 分钟。"],0:["腿 · 核心",[["自由杠深蹲",3,"6–8","1–2"],["罗马尼亚硬拉",3,"8–10","1–2"],["腿举",3,"10–15","1"],["腿弯举",3,"10–15","1"],["提踵",3,"10–15","1"],["绳索卷腹",3,"10–15","1–2"]]]};
const N=["日","一","二","三","四","五","六"],now=new Date(),today=now.getDay();let sel=today,active=false,ti=null,left=90,currentTab="today";
const mon=d=>{let x=new Date(d),w=x.getDay()||7;x.setDate(x.getDate()-w+1);x.setHours(12,0,0,0);return x},WK=()=>mon(now).toISOString().slice(0,10),K=(e,s,f)=>"mo3-"+WK()+"-"+sel+"-"+e+"-"+s+"-"+f;
function week(){weekEl.innerHTML="";for(let i=0;i<7;i++){let d=new Date(now);d.setDate(now.getDate()+i);let wd=d.getDay(),b=document.createElement("button");b.className="day "+(wd===sel?"on":"");b.innerHTML=(i===0?"今天":"周"+N[wd])+"<br><b>"+d.getDate()+"</b>";b.onclick=()=>{sel=wd;active=false;stopTimer();render()};weekEl.appendChild(b)}weekEl.scrollLeft=0}
function renderOverview(){let p=P[sel],sets=p[1].reduce((a,e)=>a+e[1],0);overview.innerHTML="";if(p[1].length){let facts=document.createElement("div");facts.className="facts";facts.innerHTML='<div class="fact"><b>'+p[1].length+'</b><small>个动作</small></div><div class="fact"><b>'+sets+'</b><small>工作组</small></div><div class="fact"><b>≈ '+Math.max(35,sets*3)+'</b><small>分钟</small></div>';overview.appendChild(facts);let card=document.createElement("div");card.className="card overview plan-list";p[1].forEach((e,i)=>card.innerHTML+='<div class="overview-item"><span class="num">'+(i+1)+'</span><b>'+e[0]+'</b><small>'+e[1]+'×'+e[2]+'</small></div>');overview.appendChild(card)}else{let n=document.createElement("div");n.className="card note";n.textContent=p[2];overview.appendChild(n)}}
function stats(){let sets=0,done=0,vol=0;P[sel][1].forEach((e,ei)=>{for(let s=0;s<e[1];s++){sets++;if(localStorage.getItem(K(ei,s,"d"))==="1")done++;vol+=(+localStorage.getItem(K(ei,s,"w"))||0)*(+localStorage.getItem(K(ei,s,"r"))||0)}});bar.style.width=(sets?done/sets*100:0)+"%";count.textContent=done+" / "+sets+" 组完成";volume.textContent=vol?Math.round(vol).toLocaleString()+" kg 训练量":""}
function renderWorkout(){list.innerHTML="";P[sel][1].forEach((e,ei)=>{let c=document.createElement("div");c.className="card exercise";c.innerHTML='<div class="exhead"><div><h3>'+(ei+1)+'. '+e[0]+'</h3><div class="meta">'+e[1]+' 组 × '+e[2]+' 次 · RIR '+e[3]+'</div></div><button class="check">✓</button></div>'+(e[4]?'<div class="warn">⚠ '+e[4]+'</div>':'');for(let s=0;s<e[1];s++){let row=document.createElement("div");row.className="sets";row.innerHTML='<span>'+(s+1)+'</span><input inputmode="decimal" data-k="'+K(ei,s,"w")+'" placeholder="kg"><input inputmode="numeric" data-k="'+K(ei,s,"r")+'" placeholder="次数"><input inputmode="numeric" data-k="'+K(ei,s,"i")+'" placeholder="RIR"><button class="setdone" data-d="'+K(ei,s,"d")+'">✓</button>';c.appendChild(row)}list.appendChild(c)});bind();stats()}
function bind(){document.querySelectorAll("input").forEach(i=>{i.value=localStorage.getItem(i.dataset.k)||"";i.oninput=()=>{localStorage.setItem(i.dataset.k,i.value);stats()}});document.querySelectorAll(".setdone").forEach(b=>{let sync=()=>b.classList.toggle("on",localStorage.getItem(b.dataset.d)==="1");sync();b.onclick=()=>{let on=localStorage.getItem(b.dataset.d)==="1";localStorage.setItem(b.dataset.d,on?"0":"1");sync();stats();if(!on)startTimer()}});document.querySelectorAll(".exercise").forEach(c=>{let bs=[...c.querySelectorAll(".setdone")],h=c.querySelector(".check"),sync=()=>{let all=bs.length&&bs.every(b=>localStorage.getItem(b.dataset.d)==="1");h.classList.toggle("on",all);c.classList.toggle("done",all)};bs.forEach(b=>b.addEventListener("click",sync));sync();h.onclick=()=>{let all=bs.every(b=>localStorage.getItem(b.dataset.d)==="1");bs.forEach(b=>localStorage.setItem(b.dataset.d,all?"0":"1"));renderWorkout()}})}
function startTimer(){clearInterval(ti);left=90;action.classList.add("running");action.textContent="组间休息 "+left+"s · 点击跳过";ti=setInterval(()=>{left--;action.textContent="组间休息 "+left+"s · 点击跳过";if(left<=0){clearInterval(ti);ti=null;action.classList.remove("running");action.textContent="休息结束 · 继续下一组";if(navigator.vibrate)navigator.vibrate([150,80,150])}},1000)}
function stopTimer(){if(ti)clearInterval(ti);ti=null;action.classList.remove("running")}
function dayDone(wd){let p=P[wd],total=p[1].reduce((a,e)=>a+e[1],0),done=0;p[1].forEach((e,ei)=>{for(let s=0;s<e[1];s++)if(localStorage.getItem("mo3-"+WK()+"-"+wd+"-"+ei+"-"+s+"-d")==="1")done++});return total>0&&done===total}
function renderCalendar(){title.textContent="训练日历";modeLabel.textContent="本月";heroSub.textContent="训练和恢复，都能一眼看到。";overview.innerHTML="";workout.classList.add("hidden");let card=document.createElement("div");card.className="card";let y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();card.innerHTML='<div class="calendar-head"><b>'+y+'年 '+(m+1)+'月</b><small>绿色 = 已完成</small></div><div class="calendar-grid" id="cg"></div>';overview.appendChild(card);let g=card.querySelector("#cg");["一","二","三","四","五","六","日"].forEach(x=>g.innerHTML+='<div class="cal-label">'+x+'</div>');for(let i=0;i<(first.getDay()+6)%7;i++)g.innerHTML+='<div></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),wd=dt.getDay(),same=mon(dt).toDateString()===mon(now).toDateString(),done=same&&dayDone(wd),isToday=d===now.getDate();g.innerHTML+='<div class="cal-day '+(done?'done ':'')+(isToday?'today':'')+'"><span>'+d+'</span>'+(done?'<i class="dot"></i>':'')+'</div>'}}
function renderHistory(){title.textContent="训练记录";modeLabel.textContent="本周";heroSub.textContent="本周打卡情况。";overview.innerHTML="";workout.classList.add("hidden");let card=document.createElement("div");card.className="card";let m=mon(now);for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let wd=d.getDay(),p=P[wd],done=dayDone(wd);card.innerHTML+='<div class="history-row"><div><strong>周'+N[wd]+' · '+p[0]+'</strong><small>'+(d.getMonth()+1)+'/'+d.getDate()+'</small></div><span class="'+(done?'green':'muted')+'">'+(done?'已完成':p[1].length?'未完成':'恢复')+'</span></div>'}overview.appendChild(card)}
function render(){week();if(currentTab==="calendar"){renderCalendar();ctaBar.classList.add("hidden");return}if(currentTab==="history"){renderHistory();ctaBar.classList.add("hidden");return}ctaBar.classList.remove("hidden");let p=P[sel];title.textContent=p[0];renderOverview();let can=p[1].length>0;if(!active){overview.classList.remove("hidden");workout.classList.add("hidden");modeLabel.textContent="今日计划";heroSub.textContent=can?"先看今天练什么，再开始。":p[2];action.textContent=can?(sel===today?"开始今天的训练":"开始这天的训练"):"今日无需力量训练";action.disabled=!can}else{overview.classList.add("hidden");workout.classList.remove("hidden");modeLabel.textContent="训练中";heroSub.textContent="专注当前动作，完成一组再休息。";action.textContent="训练进行中";action.disabled=false;renderWorkout()}}
action.onclick=()=>{if(!active&&P[sel][1].length){active=true;render();setTimeout(()=>document.querySelector(".exercise")?.scrollIntoView({behavior:"smooth",block:"start"}),100)}else if(active&&ti){stopTimer();action.textContent="继续下一组"}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));active=false;stopTimer();render()});const weekEl=document.querySelector("#week");date.textContent=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",month:"long",day:"numeric",weekday:"long"}).format(now);render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
