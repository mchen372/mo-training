<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0a"><link rel="manifest" href="manifest.webmanifest"><title>MO TRAINING</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0a;color:#f4f6f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}main{max-width:760px;margin:auto;padding:24px 18px 100px}.muted{color:#8b938e}.green{color:#a7ff3f}.hero{padding:24px 0 18px}.hero h1{font-size:42px;line-height:1;margin:8px 0}.card{background:#141715;border:1px solid #252a27;border-radius:22px;padding:18px;margin:12px 0}.week{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.day{min-width:66px;padding:11px 8px;border-radius:15px;background:#171a18;border:1px solid #292e2b;text-align:center;color:#aeb5b0}.day.on{background:#a7ff3f;color:#071006;border-color:#a7ff3f}.exercise h3{margin:0 0 6px}.meta{font-size:14px;color:#9da49f}.tag{display:inline-block;background:#20251f;color:#b8ff68;padding:5px 9px;border-radius:99px;font-size:12px;margin-top:9px}.warn{border-left:3px solid #f5c542;padding-left:12px;color:#d9d2ad;margin-top:10px;font-size:13px}.sets{margin-top:13px;display:grid;grid-template-columns:32px 1fr 1fr 1fr;gap:7px}.sets input{width:100%;background:#0d100e;border:1px solid #303632;border-radius:10px;color:white;padding:10px 6px;text-align:center}.sets span{text-align:center;padding-top:10px;color:#777}.rest{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 36px));background:#a7ff3f;color:#081007;border:0;border-radius:18px;padding:16px;font-weight:800;font-size:16px}button{cursor:pointer}.empty{text-align:center;padding:40px 10px}.section-title{display:flex;justify-content:space-between;align-items:end;margin-top:18px}small{color:#788079}</style></head><body><main>
<div class="hero"><div class="muted" id="date"></div><h1>MO <span class="green">TRAINING</span></h1><div class="muted">增肌优先 · 上胸 / 侧三角 / 背阔 / 手臂</div></div>
<div class="week" id="week"></div><div class="section-title"><h2 id="title"></h2><small id="phase">V1.0 · 8周周期</small></div><div id="list"></div>
</main><button class="rest" id="timer">开始组间休息 · 90s</button><script>
const plans={
1:{title:"上胸 · 侧三角 · 三头",ex:[["上斜杠铃卧推","3 × 6–8","RIR 1–2"],["平板杠铃卧推","3 × 6–8","RIR 1–2"],["蝴蝶机 / 绳索夹胸","2 × 10–15","RIR 1"],["绳索侧平举","4 × 12–20","RIR 1"],["绳索过顶臂屈伸","3 × 10–15","RIR 1"],["绳索下压","2 × 10–15","RIR 1"]]},
2:{title:"背宽 · 二头",ex:[["辅助引体 / 中立位下拉","3 × 6–10","RIR 1–2"],["单臂高位下拉","3 × 8–12","RIR 1"],["胸托划船","3 × 8–12","RIR 1–2"],["直臂下压","2 × 12–15","RIR 1"],["上斜哑铃弯举","3 × 8–12","RIR 1"],["锤式弯举","3 × 10–15","RIR 1"]]},
3:{title:"恢复日 · 游泳",note:"轻—中等强度游泳 45–60 分钟。今天不竞速，把恢复放第一位。"},
4:{title:"肩 · 背 · 手臂",ex:[["坐姿哑铃推肩","3 × 6–10","RIR 1–2","核心收紧，避免腰椎过伸；先用 20kg/手稳定完成。"],["绳索侧平举","4 × 12–20","RIR 1"],["反向蝴蝶机","3 × 12–20","RIR 1"],["高位下拉","3 × 8–12","RIR 1–2"],["绳索过顶臂屈伸","3 × 10–15","RIR 1"],["牧师凳弯举","3 × 8–12","RIR 1"]]},
5:{title:"完全休息",note:"不补课，不偷偷练。睡好、吃够蛋白，给周六留状态。"},
6:{title:"上胸 · 侧三角 + 游泳",ex:[["上斜器械 / 哑铃推胸","3 × 8–12","RIR 1–2"],["低位向上绳索夹胸","2 × 12–15","RIR 1"],["器械侧平举","4 × 12–20","RIR 1"]],note:"力量训练后，中等强度游泳 45–60 分钟。"},
0:{title:"腿 · 核心",ex:[["自由杠深蹲","3 × 6–8","RIR 1–2"],["罗马尼亚硬拉","3 × 8–10","RIR 1–2"],["腿举","3 × 10–15","RIR 1"],["腿弯举","3 × 10–15","RIR 1"],["提踵","3 × 10–15","RIR 1"],["绳索卷腹","3 × 10–15","RIR 1–2"]]}
};
const names=["日","一","二","三","四","五","六"], now=new Date(), today=now.getDay(); let selected=today;
function monday(d){let x=new Date(d);let wd=x.getDay()||7;x.setDate(x.getDate()-wd+1);x.setHours(12,0,0,0);return x}
function renderWeek(){let m=monday(now), el=document.querySelector("#week");el.innerHTML="";for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let wd=d.getDay(),b=document.createElement("button");b.className="day "+(wd===selected?"on":"");b.innerHTML="周"+names[wd]+"<br><b>"+d.getDate()+"</b>";b.onclick=()=>{selected=wd;render()};el.appendChild(b)}}
function render(){renderWeek();let p=plans[selected];document.querySelector("#title").textContent=p.title;let l=document.querySelector("#list");l.innerHTML="";if(p.note){let n=document.createElement("div");n.className="card empty";n.textContent=p.note;l.appendChild(n)}(p.ex||[]).forEach((e,idx)=>{let c=document.createElement("div");c.className="card exercise";let key="mo-"+selected+"-"+idx;c.innerHTML='<h3>'+(idx+1)+'. '+e[0]+'</h3><div class="meta">'+e[1]+' · '+e[2]+'</div><span class="tag">双进阶</span>'+(e[3]?'<div class="warn">⚠ '+e[3]+'</div>':'')+'<div class="sets"><span>#</span><small>重量kg</small><small>次数</small><small>RIR</small></div>';for(let s=1;s<=3;s++){let row=document.createElement("div");row.className="sets";row.innerHTML='<span>'+s+'</span><input inputmode="decimal" data-k="'+key+'-w'+s+'" placeholder="kg"><input inputmode="numeric" data-k="'+key+'-r'+s+'" placeholder="reps"><input inputmode="numeric" data-k="'+key+'-i'+s+'" placeholder="RIR">';c.appendChild(row)}l.appendChild(c)});document.querySelectorAll("input").forEach(i=>{i.value=localStorage.getItem(i.dataset.k)||"";i.oninput=()=>localStorage.setItem(i.dataset.k,i.value)})}
document.querySelector("#date").textContent=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",month:"long",day:"numeric",weekday:"long"}).format(now);
let t=null,left=90,btn=document.querySelector("#timer");btn.onclick=()=>{if(t){clearInterval(t);t=null;left=90;btn.textContent="开始组间休息 · 90s";return}left=90;btn.textContent="休息 "+left+"s · 点击取消";t=setInterval(()=>{left--;btn.textContent="休息 "+left+"s · 点击取消";if(left<=0){clearInterval(t);t=null;btn.textContent="休息结束 · 再来一组";if(navigator.vibrate)navigator.vibrate(200)}},1000)};render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
