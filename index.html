const P={1:["上胸 · 侧三角 · 三头",[["上斜杠铃卧推",3,"6–8","1–2"],["平板杠铃卧推",3,"6–8","1–2"],["蝴蝶机 / 绳索夹胸",2,"10–15","1"],["绳索侧平举",4,"12–20","1"],["绳索过顶臂屈伸",3,"10–15","1"],["绳索下压",2,"10–15","1"]]],2:["背宽 · 二头",[["辅助引体 / 中立位下拉",3,"6–10","1–2"],["单臂高位下拉",3,"8–12","1"],["胸托划船",3,"8–12","1–2"],["直臂下压",2,"12–15","1"],["上斜哑铃弯举",3,"8–12","1"],["锤式弯举",3,"10–15","1"]]],3:["恢复日 · 游泳",[],"轻—中等强度游泳 45–60 分钟。今天不竞速。"],4:["肩 · 背 · 手臂",[["坐姿哑铃推肩",3,"6–10","1–2","核心收紧，避免腰椎过伸；先用 20kg/手稳定完成。"],["绳索侧平举",4,"12–20","1"],["反向蝴蝶机",3,"12–20","1"],["高位下拉",3,"8–12","1–2"],["绳索过顶臂屈伸",3,"10–15","1"],["牧师凳弯举",3,"8–12","1"]]],5:["完全休息",[],"今天不补训练。恢复本身就是计划的一部分。"],6:["上胸 · 侧三角 + 游泳",[["上斜器械 / 哑铃推胸",3,"8–12","1–2"],["低位向上绳索夹胸",2,"12–15","1"],["器械侧平举",4,"12–20","1"]],"力量后中等强度游泳 45–60 分钟。"],0:["腿 · 核心",[["自由杠深蹲",3,"6–8","1–2"],["罗马尼亚硬拉",3,"8–10","1–2"],["腿举",3,"10–15","1"],["腿弯举",3,"10–15","1"],["提踵",3,"10–15","1"],["绳索卷腹",3,"10–15","1–2"]]]};
const N=["日","一","二","三","四","五","六"],now=new Date(),today=now.getDay();let sel=today,selOffset=0,active=false,ti=null,left=90,currentTab="today";
const mon=d=>{let x=new Date(d),w=x.getDay()||7;x.setDate(x.getDate()-w+1);x.setHours(12,0,0,0);return x},WK=()=>mon(now).toISOString().slice(0,10),K=(e,s,f)=>"mo3-"+WK()+"-"+sel+"-"+e+"-"+s+"-"+f;
function week(){weekEl.innerHTML="";for(let i=0;i<7;i++){let d=new Date(now);d.setDate(now.getDate()+i);let wd=d.getDay(),b=document.createElement("button");b.className="day "+(wd===sel?"on":"");b.innerHTML=(i===0?"今天":"周"+N[wd])+"<br><b>"+d.getDate()+"</b>";b.onclick=()=>{sel=wd;selOffset=i;active=false;stopTimer();render()};weekEl.appendChild(b)}requestAnimationFrame(()=>{weekEl.scrollLeft=0})}
function renderOverview(){let p=P[sel],sets=p[1].reduce((a,e)=>a+e[1],0);overview.innerHTML="";if(p[1].length){let facts=document.createElement("div");facts.className="facts";facts.innerHTML='<div class="fact"><b>'+p[1].length+'</b><small>个动作</small></div><div class="fact"><b>'+sets+'</b><small>工作组</small></div><div class="fact"><b>≈ '+Math.max(35,sets*3)+'</b><small>分钟</small></div>';overview.appendChild(facts);let card=document.createElement("div");card.className="card overview plan-list";p[1].forEach((e,i)=>card.innerHTML+='<div class="overview-item"><span class="num">'+(i+1)+'</span><b>'+e[0]+'</b><small>'+e[1]+'×'+e[2]+'</small></div>');overview.appendChild(card)}else{let n=document.createElement("div");n.className="card note";n.textContent=p[2];overview.appendChild(n)}}
function stats(){let sets=0,done=0,vol=0;P[sel][1].forEach((e,ei)=>{for(let s=0;s<e[1];s++){sets++;if(localStorage.getItem(K(ei,s,"d"))==="1")done++;vol+=(+localStorage.getItem(K(ei,s,"w"))||0)*(+localStorage.getItem(K(ei,s,"r"))||0)}});bar.style.width=(sets?done/sets*100:0)+"%";count.textContent=done+" / "+sets+" 组完成";volume.textContent=vol?Math.round(vol).toLocaleString()+" kg 训练量":""}
function renderWorkout(){list.innerHTML="";P[sel][1].forEach((e,ei)=>{let c=document.createElement("div");c.className="card exercise";c.innerHTML='<div class="exhead"><div><h3>'+(ei+1)+'. '+e[0]+'</h3><div class="meta">'+e[1]+' 组 × '+e[2]+' 次 · RIR '+e[3]+'</div></div><button class="check">✓</button></div>'+(e[4]?'<div class="warn">⚠ '+e[4]+'</div>':'');for(let s=0;s<e[1];s++){let row=document.createElement("div");row.className="sets";row.innerHTML='<span>'+(s+1)+'</span><input inputmode="decimal" data-k="'+K(ei,s,"w")+'" placeholder="kg"><input inputmode="numeric" data-k="'+K(ei,s,"r")+'" placeholder="次数"><input inputmode="numeric" data-k="'+K(ei,s,"i")+'" placeholder="RIR"><button class="setdone" data-d="'+K(ei,s,"d")+'">✓</button>';c.appendChild(row)}list.appendChild(c)});bind();stats()}
function bind(){document.querySelectorAll("input").forEach(i=>{i.value=localStorage.getItem(i.dataset.k)||"";i.oninput=()=>{localStorage.setItem(i.dataset.k,i.value);stats()}});document.querySelectorAll(".setdone").forEach(b=>{let sync=()=>b.classList.toggle("on",localStorage.getItem(b.dataset.d)==="1");sync();b.onclick=()=>{let on=localStorage.getItem(b.dataset.d)==="1";localStorage.setItem(b.dataset.d,on?"0":"1");sync();stats();if(!on)startTimer()}});document.querySelectorAll(".exercise").forEach(c=>{let bs=[...c.querySelectorAll(".setdone")],h=c.querySelector(".check"),sync=()=>{let all=bs.length&&bs.every(b=>localStorage.getItem(b.dataset.d)==="1");h.classList.toggle("on",all);c.classList.toggle("done",all)};bs.forEach(b=>b.addEventListener("click",sync));sync();h.onclick=()=>{let all=bs.every(b=>localStorage.getItem(b.dataset.d)==="1");bs.forEach(b=>localStorage.setItem(b.dataset.d,all?"0":"1"));renderWorkout()}})}
function startTimer(){clearInterval(ti);left=90;action.classList.add("running");action.textContent="组间休息 "+left+"s · 点击跳过";ti=setInterval(()=>{left--;action.textContent="组间休息 "+left+"s · 点击跳过";if(left<=0){clearInterval(ti);ti=null;action.classList.remove("running");action.textContent="休息结束 · 继续下一组";if(navigator.vibrate)navigator.vibrate([150,80,150])}},1000)}

function renderCalendar(){title.textContent="训练日历";modeLabel.textContent="本月";heroSub.textContent="训练和恢复，都能一眼看到。";overview.innerHTML="";workout.classList.add("hidden");let card=document.createElement("div");card.className="card";let y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();card.innerHTML='<div class="calendar-head"><b>'+y+'年 '+(m+1)+'月</b><small>绿色 = 已完成</small></div><div class="calendar-grid" id="cg"></div>';overview.appendChild(card);let g=card.querySelector("#cg");["一","二","三","四","五","六","日"].forEach(x=>g.innerHTML+='<div class="cal-label">'+x+'</div>');for(let i=0;i<(first.getDay()+6)%7;i++)g.innerHTML+='<div></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),wd=dt.getDay(),same=mon(dt).toDateString()===mon(now).toDateString(),done=same&&dayDone(wd),isToday=d===now.getDate();g.innerHTML+='<div class="cal-day '+(done?'done ':'')+(isToday?'today':'')+'"><span>'+d+'</span>'+(done?'<i class="dot"></i>':'')+'</div>'}}
function renderHistory(){title.textContent="训练记录";modeLabel.textContent="本周";heroSub.textContent="本周打卡情况。";overview.innerHTML="";workout.classList.add("hidden");let card=document.createElement("div");card.className="card";let m=mon(now);for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let wd=d.getDay(),p=P[wd],done=dayDone(wd);card.innerHTML+='<div class="history-row"><div><strong>周'+N[wd]+' · '+p[0]+'</strong><small>'+(d.getMonth()+1)+'/'+d.getDate()+'</small></div><span class="'+(done?'green':'muted')+'">'+(done?'已完成':p[1].length?'未完成':'恢复')+'</span></div>'}overview.appendChild(card)}
function setCTA(show){ctaBar.classList.toggle("hidden",!show);document.body.classList.toggle("no-cta",!show)}function render(){week();let isTodayTab=currentTab==="today";weekEl.classList.toggle("hidden",!isTodayTab);if(currentTab==="calendar"){setCTA(false);renderCalendar();return}if(currentTab==="history"){setCTA(false);renderHistory();return}let p=P[sel],can=p[1].length>0,isActualToday=selOffset===0;title.textContent=p[0];renderOverview();if(!active){overview.classList.remove("hidden");workout.classList.add("hidden");modeLabel.textContent=isActualToday?"今日计划":"计划预览";heroSub.textContent=can?(isActualToday?"先看今天练什么，再开始。":"提前看看安排，到了当天再开始训练。"):p[2];setCTA(can&&isActualToday);if(can&&isActualToday){action.textContent="开始今天的训练";action.disabled=false}}else{setCTA(true);overview.classList.add("hidden");workout.classList.remove("hidden");modeLabel.textContent="训练中";heroSub.textContent="专注当前动作，完成一组再休息。";action.textContent="训练进行中";action.disabled=false;renderWorkout()}}
action.onclick=()=>{if(selOffset!==0)return;if(!active&&P[sel][1].length){active=true;render();setTimeout(()=>document.querySelector(".exercise")?.scrollIntoView({behavior:"smooth",block:"start"}),100)}else if(active&&ti){stopTimer();action.textContent="继续下一组"}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));active=false;stopTimer();render()});const weekEl=document.querySelector("#week");date.textContent=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",month:"long",day:"numeric",weekday:"long"}).format(now);render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js?v=3",{updateViaCache:"none"}).then(r=>r.update());
