<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0a"><link rel="manifest" href="manifest.webmanifest"><title>MO TRAINING</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0a;color:#f4f6f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:760px;margin:auto;padding:18px 16px 120px}.muted{color:#8b938e}.green{color:#a7ff3f}.hero{padding:18px 2px 14px}.hero h1{font-size:38px;line-height:1;margin:7px 0}.card{background:#141715;border:1px solid #252a27;border-radius:20px;padding:16px;margin:10px 0}.week{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.day{min-width:62px;padding:10px 7px;border-radius:14px;background:#171a18;border:1px solid #292e2b;text-align:center;color:#aeb5b0}.day.on{background:#a7ff3f;color:#071006;border-color:#a7ff3f}.section-title{display:flex;justify-content:space-between;align-items:end;margin-top:15px}.section-title h2{margin:0}.progress{height:5px;background:#222724;border-radius:9px;overflow:hidden;margin:12px 0 4px}.progress i{display:block;height:100%;background:#a7ff3f;width:0;transition:.25s}.summary{display:flex;justify-content:space-between;font-size:13px;color:#89918c}.exercise.done{border-color:#47642d}.exhead{display:flex;justify-content:space-between;gap:10px}.check{width:30px;height:30px;border-radius:50%;border:1px solid #3a413c;background:#1b1f1c;color:#667068;font-size:16px}.check.on{background:#a7ff3f;color:#071006;border-color:#a7ff3f}.exercise h3{margin:0 0 5px;font-size:17px}.meta{font-size:13px;color:#9da49f}.warn{border-left:3px solid #f5c542;padding-left:10px;color:#d9d2ad;margin-top:10px;font-size:13px}.sets{margin-top:10px;display:grid;grid-template-columns:28px 1fr 1fr 1fr 38px;gap:6px;align-items:center}.sets input{min-width:0;width:100%;background:#0d100e;border:1px solid #303632;border-radius:10px;color:white;padding:10px 4px;text-align:center;font-size:16px}.sets input:focus{outline:1px solid #a7ff3f}.setdone{height:36px;border-radius:10px;border:1px solid #303632;background:#111411;color:#777}.setdone.on{background:#26351b;color:#a7ff3f;border-color:#47642d}.sets span{text-align:center;color:#777}.add{width:100%;margin-top:10px;padding:10px;border-radius:11px;background:transparent;border:1px dashed #343a36;color:#8e9791}.note{text-align:center;padding:32px 16px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#090b0a 25%)}.rest{display:block;margin:auto;width:min(728px,100%);background:#a7ff3f;color:#081007;border:0;border-radius:17px;padding:15px;font-weight:800;font-size:16px}.rest.running{background:#f4f6f5}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#f4f6f5;color:#111;padding:10px 14px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}button{cursor:pointer}small{color:#788079}</style></head><body><main>
<div class="hero"><div class="muted" id="date"></div><h1>MO <span class="green">TRAINING</span></h1><div class="muted">今天只管完成下一组。</div></div>
<div class="week" id="week"></div><div class="section-title"><h2 id="title"></h2><small>8周增肌周期</small></div><div class="progress"><i id="bar"></i></div><div class="summary"><span id="count"></span><span id="volume"></span></div><div id="list"></div>
</main><div class="bottom"><button class="rest" id="timer">开始休息 · 90s</button></div><div class="toast" id="toast">已保存</div><script>
const P={1:["上胸 · 侧三角 · 三头",[["上斜杠铃卧推",3,"6–8","1–2"],["平板杠铃卧推",3,"6–8","1–2"],["蝴蝶机 / 绳索夹胸",2,"10–15","1"],["绳索侧平举",4,"12–20","1"],["绳索过顶臂屈伸",3,"10–15","1"],["绳索下压",2,"10–15","1"]]],2:["背宽 · 二头",[["辅助引体 / 中立位下拉",3,"6–10","1–2"],["单臂高位下拉",3,"8–12","1"],["胸托划船",3,"8–12","1–2"],["直臂下压",2,"12–15","1"],["上斜哑铃弯举",3,"8–12","1"],["锤式弯举",3,"10–15","1"]]],3:["恢复日 · 游泳",[],"轻—中等强度游泳 45–60 分钟。今天不竞速。"],4:["肩 · 背 · 手臂",[["坐姿哑铃推肩",3,"6–10","1–2","核心收紧，避免腰椎过伸；先用 20kg/手稳定完成。"],["绳索侧平举",4,"12–20","1"],["反向蝴蝶机",3,"12–20","1"],["高位下拉",3,"8–12","1–2"],["绳索过顶臂屈伸",3,"10–15","1"],["牧师凳弯举",3,"8–12","1"]]],5:["完全休息",[],"今天不补训练。恢复本身就是计划的一部分。"],6:["上胸 · 侧三角 + 游泳",[["上斜器械 / 哑铃推胸",3,"8–12","1–2"],["低位向上绳索夹胸",2,"12–15","1"],["器械侧平举",4,"12–20","1"]],"力量后中等强度游泳 45–60 分钟。"],0:["腿 · 核心",[["自由杠深蹲",3,"6–8","1–2"],["罗马尼亚硬拉",3,"8–10","1–2"],["腿举",3,"10–15","1"],["腿弯举",3,"10–15","1"],["提踵",3,"10–15","1"],["绳索卷腹",3,"10–15","1–2"]]]};
const N=["日","一","二","三","四","五","六"],now=new Date(),today=now.getDay();let sel=today;
const mon=d=>{let x=new Date(d),w=x.getDay()||7;x.setDate(x.getDate()-w+1);x.setHours(12,0,0,0);return x}, weekKey=()=>{let m=mon(now);return m.toISOString().slice(0,10)},K=(e,s,f)=>"mo2-"+weekKey()+"-"+sel+"-"+e+"-"+s+"-"+f;
function week(){let m=mon(now),el=document.querySelector("#week");el.innerHTML="";for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let wd=d.getDay(),b=document.createElement("button");b.className="day "+(wd===sel?"on":"");b.innerHTML="周"+N[wd]+"<br><b>"+d.getDate()+"</b>";b.onclick=()=>{sel=wd;render()};el.appendChild(b)}}
function stats(){let sets=0,done=0,vol=0;(P[sel][1]||[]).forEach((e,ei)=>{for(let s=0;s<e[1];s++){sets++;if(localStorage.getItem(K(ei,s,"d"))==="1")done++;let w=+localStorage.getItem(K(ei,s,"w"))||0,r=+localStorage.getItem(K(ei,s,"r"))||0;vol+=w*r}});bar.style.width=(sets?done/sets*100:0)+"%";count.textContent=sets?done+" / "+sets+" 组完成":"";volume.textContent=vol?Math.round(vol).toLocaleString()+" kg 训练量":""}
function render(){week();let p=P[sel];title.textContent=p[0];list.innerHTML="";if(p[2]){let n=document.createElement("div");n.className="card note";n.textContent=p[2];list.appendChild(n)}p[1].forEach((e,ei)=>{let c=document.createElement("div");c.className="card exercise";c.innerHTML='<div class="exhead"><div><h3>'+(ei+1)+'. '+e[0]+'</h3><div class="meta">'+e[1]+' 组 × '+e[2]+' 次 · RIR '+e[3]+'</div></div><button class="check">✓</button></div>'+(e[4]?'<div class="warn">⚠ '+e[4]+'</div>':'');for(let s=0;s<e[1];s++){let row=document.createElement("div");row.className="sets";row.innerHTML='<span>'+(s+1)+'</span><input inputmode="decimal" data-k="'+K(ei,s,"w")+'" placeholder="kg"><input inputmode="numeric" data-k="'+K(ei,s,"r")+'" placeholder="次数"><input inputmode="numeric" data-k="'+K(ei,s,"i")+'" placeholder="RIR"><button class="setdone" data-d="'+K(ei,s,"d")+'">✓</button>';c.appendChild(row)}list.appendChild(c)});bind();stats()}
function bind(){document.querySelectorAll("input").forEach(i=>{i.value=localStorage.getItem(i.dataset.k)||"";i.oninput=()=>{localStorage.setItem(i.dataset.k,i.value);stats()}});document.querySelectorAll(".setdone").forEach(b=>{let sync=()=>b.classList.toggle("on",localStorage.getItem(b.dataset.d)==="1");sync();b.onclick=()=>{let on=localStorage.getItem(b.dataset.d)==="1";localStorage.setItem(b.dataset.d,on?"0":"1");sync();stats();if(!on)startRest()}});document.querySelectorAll(".exercise").forEach(c=>{let bs=[...c.querySelectorAll(".setdone")],h=c.querySelector(".check"),sync=()=>{let all=bs.length&&bs.every(b=>localStorage.getItem(b.dataset.d)==="1");h.classList.toggle("on",all);c.classList.toggle("done",all)};bs.forEach(b=>b.addEventListener("click",sync));sync();h.onclick=()=>{let all=bs.every(b=>localStorage.getItem(b.dataset.d)==="1");bs.forEach(b=>localStorage.setItem(b.dataset.d,all?"0":"1"));render()}})}
date.textContent=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",month:"long",day:"numeric",weekday:"long"}).format(now);
let ti=null,left=90;function startRest(){clearInterval(ti);left=90;timer.classList.add("running");timer.textContent="休息 "+left+"s · 点击结束";ti=setInterval(()=>{left--;timer.textContent="休息 "+left+"s · 点击结束";if(left<=0){clearInterval(ti);ti=null;timer.classList.remove("running");timer.textContent="休息结束 · 开始下一组";if(navigator.vibrate)navigator.vibrate([150,80,150])}},1000)}timer.onclick=()=>{if(ti){clearInterval(ti);ti=null;timer.classList.remove("running");timer.textContent="开始休息 · 90s"}else startRest()};render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
