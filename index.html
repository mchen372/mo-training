function renderCalendar(){title.textContent="训练日历";modeLabel.textContent="本月";heroSub.textContent="训练和恢复，都能一眼看到。";overview.innerHTML="";workout.classList.add("hidden");let card=document.createElement("div");card.className="card";let y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();card.innerHTML='<div class="calendar-head"><b>'+y+'年 '+(m+1)+'月</b><small>绿色 = 已完成</small></div><div class="calendar-grid" id="cg"></div>';overview.appendChild(card);let g=card.querySelector("#cg");["一","二","三","四","五","六","日"].forEach(x=>g.innerHTML+='<div class="cal-label">'+x+'</div>');for(let i=0;i<(first.getDay()+6)%7;i++)g.innerHTML+='<div></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),wd=dt.getDay(),same=mon(dt).toDateString()===mon(now).toDateString(),done=same&&dayDone(wd),isToday=d===now.getDate();g.innerHTML+='<div class="cal-day '+(done?'done ':'')+(isToday?'today':'')+'"><span>'+d+'</span>'+(done?'<i class="dot"></i>':'')+'</div>'}}
function renderHistory(){title.textContent="训练记录";modeLabel.textContent="本周";heroSub.textContent="本周打卡情况。";overview.innerHTML="";workout.classList.add("hidden");let card=document.createElement("div");card.className="card";let m=mon(now);for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let wd=d.getDay(),p=P[wd],done=dayDone(wd);card.innerHTML+='<div class="history-row"><div><strong>周'+N[wd]+' · '+p[0]+'</strong><small>'+(d.getMonth()+1)+'/'+d.getDate()+'</small></div><span class="'+(done?'green':'muted')+'">'+(done?'已完成':p[1].length?'未完成':'恢复')+'</span></div>'}overview.appendChild(card)}
function setCTA(show){ctaBar.classList.toggle("hidden",!show);document.body.classList.toggle("no-cta",!show)}function fmtElapsed(ms){let s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60),h=Math.floor(m/60);m%=60;s%=60;return h?String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"):String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}function updateSessionTimer(){if(sessionStart)focusTimer.textContent=fmtElapsed(Date.now()-sessionStart)}function startSessionTimer(){if(!sessionStart){sessionStart=Date.now();localStorage.setItem("mo-session-start",sessionStart)}localStorage.setItem("mo-active","1");localStorage.removeItem("mo-paused");paused=false;clearInterval(sessionTi);updateSessionTimer();sessionTi=setInterval(updateSessionTimer,1000)}function stopSessionTimer(reset=false){clearInterval(sessionTi);sessionTi=null;if(reset){sessionStart=0;localStorage.removeItem("mo-session-start");localStorage.removeItem("mo-active");focusTimer.textContent="00:00"}}function setFocus(on){document.body.classList.toggle("focus-mode",on);if(on){focusTitle.textContent=P[sel][0];focusSub.textContent="今日训练 · "+P[sel][1].reduce((a,e)=>a+e[1],0)+" 组";updateSessionTimer()}}function render(){week();const hd=document.getElementById("heroDate");if(hd){const d=new Date(now);d.setDate(now.getDate()+selOffset);const ws=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];hd.textContent=`${d.getMonth()+1}月${d.getDate()}日 · ${ws[d.getDay()]}`;}setFocus(active&&currentTab==="today");let isTodayTab=currentTab==="today";weekEl.classList.toggle("hidden",!isTodayTab);if(currentTab==="calendar"){setCTA(false);renderCalendar();return}if(currentTab==="history"){setCTA(false);renderHistory();return}let p=P[sel],can=p[1].length>0,isActualToday=selOffset===0;title.textContent=p[0];renderOverview();if(!active){overview.classList.remove("hidden");workout.classList.add("hidden");modeLabel.textContent=isActualToday?"今日计划":"计划预览";heroSub.textContent=can?(isActualToday?"先看今天练什么，再开始。":"提前看看安排，到了当天再开始训练。"):p[2];setCTA(can&&isActualToday);if(can&&isActualToday){const finished=localStorage.getItem(DONEKEY())==="1",hasSession=!!sessionStart&&localStorage.getItem("mo-active")==="1";if(finished){action.textContent="今日训练已完成";action.disabled=true;restart.classList.remove("hidden");restart.textContent="重新训练"}else{action.textContent=hasSession?"继续训练":"开始今天的训练";action.disabled=false;restart.classList.toggle("hidden",!hasSession);restart.textContent="重新开始"}}}else{restart.classList.add("hidden");setCTA(true);overview.classList.add("hidden");workout.classList.remove("hidden");modeLabel.textContent="训练中";heroSub.textContent="专注当前动作，完成一组再休息。";action.textContent="结束训练";action.disabled=false;action.classList.add("finish-action");renderWorkout()}}
focusBack.onclick=()=>{active=false;localStorage.setItem("mo-view","home");paused=true;localStorage.setItem("mo-paused","1");stopTimer();clearInterval(sessionTi);sessionTi=null;render();document.querySelector("main").scrollTop=0};restart.onclick=async()=>{if(!await ask("重新开始训练？","今天已记录的重量、次数、RIR 和完成状态会被清空。","重新开始",true))return;const prefix="mo3-"+WK()+"-"+sel+"-";Object.keys(localStorage).filter(k=>k.startsWith(prefix)).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(DONEKEY());sessionStart=Date.now();localStorage.setItem("mo-session-start",sessionStart);localStorage.setItem("mo-active","1");localStorage.removeItem("mo-paused");paused=false;active=true;localStorage.setItem("mo-view","workout");restart.classList.add("hidden");startSessionTimer();render();document.querySelector("main").scrollTop=0};action.onclick=async()=>{if(selOffset!==0)return;if(!active&&P[sel][1].length){active=true;localStorage.setItem("mo-view","workout");localStorage.removeItem("mo-paused");paused=false;localStorage.setItem("mo-active","1");startSessionTimer();document.body.classList.add("focus-enter");render();const scroller=document.querySelector("main");scroller.scrollTop=0;requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("focus-go")));setTimeout(()=>document.body.classList.remove("focus-enter","focus-go"),480)}else if(active&&ti){stopTimer();action.textContent="结束训练"}else if(active){const complete=dayDone(sel);if(complete){if(!await ask("完成今天的训练？","所有训练组都已完成，本次训练将保存到记录。","完成训练",false))return}else{if(!await ask("提前结束训练？","还有训练组未完成，已记录的数据会保留。","结束训练",true))return}localStorage.setItem(DONEKEY(),"1");active=false;localStorage.setItem("mo-view","home");paused=false;stopTimer();stopSessionTimer(true);render();document.querySelector("main").scrollTop=0}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;localStorage.setItem("mo-view","home");document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));active=false;stopTimer();clearInterval(sessionTi);sessionTi=null;render()});const weekEl=document.querySelector("#week");render();if(active){startSessionTimer();document.querySelector("main").scrollTop=0}if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js?v=3",{updateViaCache:"none"}).then(r=>r.update());
</script></body></html>
